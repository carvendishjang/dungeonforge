name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the web app
        run: npm run build -w apps/web

  docker:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t dungeonforge .

      - name: Smoke test the container
        run: |
          docker run -d --name df -p 3001:3001 dungeonforge
          for i in $(seq 1 20); do
            curl -sf http://localhost:3001/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3001/api/health
          curl -sf http://localhost:3001/ | grep -q '<div id="root">'
          curl -sf -X POST http://localhost:3001/api/generate \
            -H 'Content-Type: application/json' -d '{"seed":7}' | grep -q '"seed":7'

      - name: Show container logs if anything failed
        if: failure()
        run: docker logs df